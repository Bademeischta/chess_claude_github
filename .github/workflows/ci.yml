name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install build deps (CPU-only torch)
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # CPU-only torch — the test suite never touches CUDA.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy pybind11 python-chess pytest

      - name: Build C++ extension
        shell: bash
        run: |
          python setup_ext.py build_ext --inplace

      - name: Run tests
        shell: bash
        run: |
          pytest tests/ -v --tb=short

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check . --exclude build,__pycache__,checkpoints,runs
        continue-on-error: true  # initial pass — don't gate merges yet
